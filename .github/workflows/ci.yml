# 最小 CI：cargo test + 冒烟脚本。job 名是 main ruleset 的必需检查上下文，不得改名。
#
# 不跑 `cargo fmt --check`：全仓格式化被仓库纪律禁止——既有代码保持现状，
# 一次性重排会产生上百处无关差异并淹没真实改动，本地实测差异上百处，放进 CI 会红。
# 新增文件的格式约束改由 gates job 的 new_file_fmt_gate.py 承担（只判增量）。
# 不跑 `cargo clippy -- -D warnings`：同理无法保证现状通过，保持 CI 全绿起步。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # 事后检测要读 PR / review / 评论三类事件，只读权限，不写任何状态
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo 缓存
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test

  smoke:
    name: smoke (pinning / streaming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo 缓存
        uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release
      # P2-3 的版本自检：二进制存在且能报告版本，再跑冒烟
      - name: 版本自检
        run: ./target/release/codex-layer --version
      - name: 冒烟：前缀钉定
        run: python3 scripts/smoke/pinning.py
      - name: 冒烟：流式转发
        run: python3 scripts/smoke/streaming.py

  # 流程门禁：提交作者角色身份 + 新增 Rust 文件格式。两个判据各带 --self-test
  # 正反对照，先自证判据可用，再判真实区间。
  gates:
    name: gates (commit author / new file fmt)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0：门禁要按基线取待入库区间，浅克隆会让区间解析不出来
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: 判据自测：提交作者
        run: python3 scripts/ci/commit_author_gate.py --self-test
      - name: 判据自测：新增文件格式
        run: python3 scripts/ci/new_file_fmt_gate.py --self-test
      - name: 提交作者角色门禁
        env:
          GATE_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/commit_author_gate.py
      - name: 新增 Rust 文件格式门禁
        env:
          GATE_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/new_file_fmt_gate.py
      # 开稳定层的集成测试必须把 tools 回填缓存指到临时目录，否则 cargo test 会
      # 往真实状态目录写测试键（只污染开发者本机，CI 完全看不见，所以必须在此拦）。
      - name: 判据自测：集成测试缓存隔离
        run: python3 scripts/ci/tools_cache_isolation_gate.py --self-test
      - name: 集成测试缓存隔离门禁
        run: python3 scripts/ci/tools_cache_isolation_gate.py
      # 安装脚本的 latest tag 解析：正反对照 + 旧写法恒空对照（离线跑，不碰网络）
      - name: 安装脚本 latest tag 解析测试
        run: bash scripts/ci/install_tag_parse_test.sh

  # 作者不得自审的事后检测（只读，判据自测 + 真实交叉）。
  # 刻意**不进** ruleset 的必需检查名单：它判的是「合并已经发生、留痕不合规」，
  # 若列必需会让一次历史违规永久卡死后续所有合并；这里只做信号与记档，
  # continue-on-error 保证它红的时候流水线仍给出整体可读的结论。
  self-approval:
    name: self-approval aftercheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判据自测：措辞表与 PR 夹具正反对照
        run: python3 scripts/ci/self_approval_gate.py --self-test
      - name: 事后检测：批准口径 × 合并时间 × 批准后的新提交
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/self_approval_gate.py
